<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Request | LifeSaver</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <header>
        <!-- Yahan index.html wala Navbar paste karo -->
    </header>

    <section class="request-section">

        <h1>Request Blood</h1>
        <p>Submit your blood requirement</p>

        <form id="requestForm">

            <input type="text" id="patientName"
                placeholder="Patient Name" required>

            <select id="requestBlood" required>
                <option value="">Select Blood Group</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>O+</option>
                <option>O-</option>
                <option>AB+</option>
                <option>AB-</option>
            </select>

            <input type="number" id="bloodUnits"
                placeholder="Required Units" min="1" max="10" required>

            <input type="text" id="hospital"
                placeholder="Hospital Name" required>

            <input type="text" id="requestCity"
                placeholder="City" required>

            <input type="tel" id="requestMobile"
                placeholder="Contact Number"
                pattern="[0-9]{10}" required>

            <button type="submit">Submit Request</button>

        </form>

    </section>

    <script src="JS/script.js"></script>

</body>
</html>
