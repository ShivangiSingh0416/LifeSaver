<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donor Registration | LifeSaver</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <a href="index.html" class="logo">
                ♥ LifeSaver
            </a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="search-donor.html">Find Donors</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

            <div class="nav-buttons">
                <a href="login.html" class="login-btn">Login</a>
                <a href="register.html" class="join-btn">Join Us</a>
            </div>

        </nav><!-- Yahan index.html wala Navbar copy karo -->
    </header>

    <section class="register-section">

        <h1>Donor Registration</h1>
        <p>Register yourself and become a lifesaver!</p>

        <form id="donorForm">

    <input type="text" id="donorName"
        placeholder="Full Name" required>

    <input type="number" id="donorAge"
        placeholder="Age (18+)" min="18" required>

    <select id="bloodGroup" required>
        <option value="">Select Blood Group</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
    </select>

    <input type="tel" id="mobile"
        placeholder="Mobile Number"
        pattern="[0-9]{10}" required>
        
    <input type="password"
       id="donorPassword"
       placeholder="Create Password"
       minlength="6"
       required>

    <input type="text" id="city"
        placeholder="City" required>

    <button type="submit">Register Now</button>

</form>

    </section>

    <script src="JS/script.js"></script>

</body>
</html>
