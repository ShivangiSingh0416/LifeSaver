<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donor Profile | LifeSaver</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <header>
        <!-- Yahan index.html wala Navbar paste karo -->
    </header>

    <section class="profile-section">

        <h1>Donor Profile</h1>
        <p>Find a registered donor profile</p>

        <form id="profileForm">

            <input type="tel"
                id="profileMobile"
                placeholder="Enter Registered Mobile Number"
                pattern="[0-9]{10}"
                required>

            <button type="submit">View Profile</button>

        </form>

        <div id="profileResult"></div>

    </section>

    <script src="JS/script.js"></script>

</body>
</html>
